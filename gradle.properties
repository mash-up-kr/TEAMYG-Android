# 병렬 워커와 Kotlin 데몬이 함께 뜨면 기본 힙에서 GC 압박을 받는다.
# MaxMetaspaceSize 는 상향이 아니라 신규 상한이다 — org.gradle.jvmargs 를 지정하면
# Gradle 기본값이 통째로 대체되므로, 적지 않으면 메타스페이스가 사실상 무제한이 된다.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Kotlin 데몬은 지정이 없으면 Gradle 데몬의 -Xmx 를 상속한다.
# 명시하지 않으면 두 프로세스가 각각 4GB 를 예약해 8GB 머신이 스와핑한다.
kotlin.daemon.jvmargs=-Xmx2048m

# 태스크 출력 재사용. CI에서는 setup-gradle 이 Gradle User Home 아래 build-cache-1 을
# 함께 캐시하므로, 이 설정이 켜져 있어야 캐시 시딩(gradle-cache-seed.yml)이 의미를 갖는다.
org.gradle.caching=true

# 독립 모듈 병렬 컴파일.
# clean 을 빌드 태스크와 한 번의 호출에 섞지 말 것(./gradlew clean build) — 병렬
# 스케줄링에서 clean 이 다른 태스크와 경쟁한다. 호출을 나눈다.
org.gradle.parallel=true

kotlin.code.style=official
