name: 리팩토링 제안
description: 코드 전체 구조 변경 또는 재설계를 제안합니다.
title: "[Refactoring]: "
labels: ["리팩터링"]
body:
  - type: markdown
    attributes:
      value: |
        리팩토링 제안을 위한 이슈입니다.
  - type: checkboxes
    id: duplicated-check
    attributes:
      label: 이미 등록된 제안인가요?
      description: 중복된 이슈가 없는지 먼저 확인해주세요!
      options:
        - label: 중복 이슈가 있는지 확인했습니다.
          required: true
  - type: textarea
    id: whats-problem
    attributes:
      label: 무슨 문제점이 있나요?
      description: 현재 코드의 어떤 부분에 문제가 있는지 작성해주세요.
      placeholder: 문제점에 대해서 설명해주세요!
    validations:
      required: true
  - type: textarea
    id: how-to-refactor
    attributes:
      label: 어떻게 변경할 것인가요?
      description: 어떤 방법으로 문제점을 해결할지 작성해주세요.
      placeholder: 해결방안에 대해서 설명해주세요!
    validations:
      required: true
  - type: textarea
    id: whats-the-goal
    attributes:
      label: 얻을 수 있는 이점은 무엇인가요?
      description: 리팩토링을 통해 얻을 수 있는 이점을 작성해주세요.
      placeholder: 이점에 대해 작성해주세요!
    validations:
      required: true
  - type: textarea
    id: affected-modules
    attributes:
      label: 영향 범위
      description: 변경이 예상되는 모듈/패키지/파일을 적어주세요.
      placeholder: |
        - 
        -
    validations:
      required: false