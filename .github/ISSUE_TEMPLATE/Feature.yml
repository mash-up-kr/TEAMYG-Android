name: 기능 요청
description: 새로운 기능 또는 요청 사항을 제안합니다.
title: "[Feature]: "
labels: ["기능"]
body:
  - type: markdown
    attributes:
      value: |
        새로운 기능 또는 요청 사항에 대해 설명해주세요.
  - type: checkboxes
    id: duplicated-check
    attributes:
      label: 이미 등록된 기능 요청인가요?
      description: 중복된 이슈가 없는지 먼저 확인해주세요!
      options:
        - label: 중복 이슈가 있는지 확인했습니다.
          required: true
  - type: textarea
    id: feature-description
    attributes:
      label: 어떤 기능인가요?
      description: 제안하는 기능에 대해 구체적으로 설명해주세요.
      placeholder: 기능에 대해서 설명해주세요!
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 제안 배경
      description: 이 기능이 왜 필요한지, 어떤 문제를 해결하는지 작성해주세요.
      placeholder: |
        - 배경:
        - 해결하려는 문제:
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: 이 기능이 완료되었다고 판단할 수 있는 조건을 체크리스트로 작성해주세요.
      value: |
        - [ ] 
        - [ ] 
        - [ ]
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: 참고 사항
      description: 관련 링크, 디자인 시안, 참고 문서 등.
    validations:
      required: false