name: 기능 이슈
description: 새로운 기능 또는 요청 사항을 제안합니다.
title: "[Feature]: "
labels: ["기능"]
body:
  - type: markdown
    attributes:
      value: |
        새로운 기능 또는 요청 사항에 대해 설명해주세요.
  - type: textarea
    id: feature-description
    attributes:
      label: 어떤 기능인가요?
      description: 제안하는 기능에 대해 구체적으로 설명해주세요.
      placeholder: 기능에 대해서 설명해주세요!
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 사항
      description: 관련 링크, 디자인 시안, 참고 문서 등.
    validations:
      required: false