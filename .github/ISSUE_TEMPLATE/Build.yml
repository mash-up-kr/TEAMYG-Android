name: 빌드
description: 빌드 환경 변경 작업입니다.
title: "[Build]: "
labels: ["빌드"]
body:
  - type: markdown
    attributes:
      value: |
        빌드 환경 관련 작업을 위한 이슈입니다.
  - type: dropdown
    id: build-type
    attributes:
      label: 작업 종류
      description: 어떤 빌드 관련 작업인가요?
      options:
        - 의존성 추가/변경/삭제
        - 빌드 스크립트 변경
        - CI/CD 설정 변경
        - 빌드 도구 버전 변경
        - 기타 환경 설정
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 작업 내용
      description: 어떤 빌드 작업을 하는지 구체적으로 작성해주세요.
      placeholder: 빌드 작업에 대해 설명해주세요!
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 작업 이유
      description: 이 변경이 왜 필요한지 작성해주세요.
      placeholder: 변경 이유에 대해 설명해주세요!
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 이 변경이 빌드/개발 환경에 미치는 영향을 작성해주세요.
      placeholder: |
        - 개발 환경:
        - 빌드 시간:
        - 기타:
    validations:
      required: false