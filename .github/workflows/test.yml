name: test

on:
  pull_request:
    branches: [ develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 17버전으로 설치
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradlew Cache를 통한 속도 향상
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Gradlew 실행을 위한 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # build 를 위한 local.properties 생성
      - name: Create local.properties
        run: |
          echo "KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}" >> local.properties

      # google-services.json 생성
      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      # 유닛 테스트 수행 (JVM 모듈은 test, Android 모듈은 testDebugUnitTest)
      - name: Run unit tests
        run: |
          ./gradlew \
            :domain:test \
            :core:util:jvm:test \
            :data:testDebugUnitTest \
            :core:util:android:testDebugUnitTest

      # 실패해도 결과를 남긴다
      - name: Publish test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Unit Test Results
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

      # 캐시 지우기
      - name: Cleanup Gradle Cache
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties
