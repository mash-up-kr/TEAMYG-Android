name: test

on:
  pull_request:
    branches: [ develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write

# 같은 PR 에 새 커밋이 오면 앞 런의 결과는 쓸 데가 없다
concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # unit-test 는 필수 체크라 paths-ignore 로 워크플로를 통째로 빼면 문서 PR 이 머지되지 않는다.
      # job 은 띄우고 스텝만 건너뛴다
      - id: changes
        uses: ./.github/actions/detect-code-changes

      - uses: ./.github/actions/setup-android-build
        if: steps.changes.outputs.code == 'true'

      - name: Restore app secrets
        if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/restore-app-secrets
        with:
          kakao-native-app-key: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # 유닛 테스트 수행 (전체 모듈. 테스트가 없는 모듈은 NO-SOURCE 로 즉시 스킵된다).
      # 계측 테스트는 에뮬레이터 없이 컴파일만 검증한다 (배선·매니페스트 회귀 방지).
      # 한 번의 호출로 묶어야 두 그래프가 병렬로 함께 스케줄된다.
      # --continue: 계측 컴파일이 먼저 깨져도 유닛 테스트는 끝까지 돌려 리포트를 남긴다
      - name: Run unit tests and compile instrumented tests
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew test assembleAllDebugAndroidTest --continue

      # 실패해도 결과를 남긴다
      - name: Publish test report
        uses: dorny/test-reporter@v2
        if: always() && steps.changes.outputs.code == 'true'
        with:
          name: Unit Test Results
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.code == 'true'
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7
