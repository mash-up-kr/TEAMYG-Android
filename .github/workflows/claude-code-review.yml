name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 리뷰어 서브에이전트가 읽을 diff 를 미리 떠 둔다. 서브에이전트는 Bash 가 없다.
      # gh pr diff 는 파일 300개를 넘으면 HTTP 406 으로 실패하므로 로컬 git diff 를 쓴다.
      - name: Prepare review material
        run: |
          REVIEW_DIR="$RUNNER_TEMP/pr-review"
          echo "REVIEW_DIR=$REVIEW_DIR" >> "$GITHUB_ENV"
          mkdir -p "$REVIEW_DIR"
          read -r base_sha head_sha < <(gh pr view "$PR_NUMBER" --json baseRefOid,headRefOid --jq '"\(.baseRefOid) \(.headRefOid)"')
          git fetch --no-tags origin "$base_sha" "pull/$PR_NUMBER/head"
          git diff --name-status "$base_sha...$head_sha" > "$REVIEW_DIR/changed-files.txt"
          git diff "$base_sha...$head_sha" > "$REVIEW_DIR/pr.diff"
          echo "HEAD_SHA=$head_sha" >> "$GITHUB_ENV"

      # 오케스트레이터 프롬프트는 기본 브랜치에서 읽는다. PR 이 프롬프트를 바꿔도 리뷰 규칙이 바뀌지 않는다.
      # (.claude/ 아래 서브에이전트 정의와 공통 규칙은 action 이 base 브랜치 버전으로 되돌린다.)
      - name: Build prompt
        id: prompt
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          delimiter="PROMPT_EOF_$(openssl rand -hex 8)"
          {
            echo "text<<${delimiter}"
            git show "origin/${DEFAULT_BRANCH}:.github/claude-review/orchestrator.md"
            echo
            echo '## 실행 정보'
            echo "- 이벤트: ${EVENT_NAME}"
            echo "- 저장소 URL: https://github.com/${{ github.repository }}"
            echo "- PR 번호: ${PR_NUMBER}"
            echo "- PR head sha: ${HEAD_SHA}"
            echo "- 리뷰 자료 디렉토리: ${REVIEW_DIR}"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      # track_progress 가 tag 모드를 강제한다. tag 모드만 @claude 코멘트 실행에서도 PR 브랜치를 체크아웃한다.
      # 리뷰어 정의는 .claude/agents/pr-review-*.md 이고, 도구가 Read/Grep/Glob 뿐이라 게시·중첩 호출을 못 한다.
      # 봇은 코드를 고치지 않는다. tag 모드가 acceptEdits 와 git add/commit 을 켜므로 disallowedTools 로 막는다.
      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        env:
          # -p 모드의 서브에이전트는 기본이 백그라운드라 결과가 유실될 수 있다. foreground 로 강제한다.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          # general-purpose·Explore 같은 내장 서브에이전트를 없애 pr-review-* 만 부를 수 있게 한다.
          CLAUDE_AGENT_SDK_DISABLE_BUILTIN_AGENTS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          track_progress: true
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model claude-sonnet-5-5
            --add-dir ${{ runner.temp }}/pr-review
            --allowedTools "Agent,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr comment:*),Read,Glob,Grep"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git push:*)"
