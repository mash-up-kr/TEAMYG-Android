name: ktlint

on:
  pull_request:
    branches: [ develop ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ktlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lint 는 필수 체크라 paths-ignore 대신 스텝만 건너뛴다
      - id: changes
        uses: ./.github/actions/detect-code-changes

      - uses: ./.github/actions/setup-android-build
        if: steps.changes.outputs.code == 'true'

      - name: Restore app secrets
        if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/restore-app-secrets
        with:
          kakao-native-app-key: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # Formatting 검사
      - name: ktlint with Gradle
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew ktlintCheck
